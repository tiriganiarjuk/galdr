[project]
name = "galdr"
version = "0.1.0"
description = "Composition engine — transforms structured render data into deployable agent artifacts"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.0",
    "typer>=0.15",
]

[project.scripts]
galdr = "galdr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Exact pin: structure/gen/ is reproducible only on this version.
    # TODO: move to 0.91.0 — it needs no constraint cleanup (delete
    # logic/transform/codegen_clean/), but it changes the generated models
    # (required fields lose their schema default), so review that diff first.
    "datamodel-code-generator==0.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

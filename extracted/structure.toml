[section_order]
section_order_order = [
    "identity",
    "security_boundary",
    "critical_rules",
    "input",
    "instructions",
    "examples",
    "output",
    "writing_output",
    "constraints",
    "anti_patterns",
    "success_criteria",
    "failure_criteria",
    "return_format",
]

[identity]
identity_pre_field_ordering = "identity_first"

identity_role_identity_postscript_visible = true
identity_role_expertise_postscript_visible = true
identity_identity_reminder_closing_visible = false


[security_boundary]

# Whether to render a label line before display entries
security_boundary_filesystem_permissions_label_visible = true

# Whether to render a preamble between heading and entries
security_boundary_framing_section_preamble_visible = true

# Whether to render a closing after entries
security_boundary_section_closing_visible = false


# Framing paradigm: selects which content posture the section uses
security_boundary_framing_selector = "territory"  # "territory" | "environmental" | "cage" — governs: security_boundary_framing_section_start_variant, security_boundary_framing_section_preamble_variant, security_boundary_framing_declaration_variant_template

[critical_rules]
# Prelude
critical_rules_authority_preamble_visible = true
critical_rules_rule_count_awareness_preamble_visible = "auto"       # "auto" | "always" | "never"
critical_rules_rule_count_awareness_preamble_template_auto_threshold = 5

# Universal rules
critical_rules_workspace_confinement_visible = true
critical_rules_fail_fast_body_visible = true
critical_rules_input_is_your_only_source_body_visible = true
critical_rules_no_invention_body_visible = true

# Output tool rules (conditional on has_output_tool)
critical_rules_output_tool_exclusivity_visible = true
critical_rules_batch_discipline_visible = true                    # also requires batch_size
# Experimental
critical_rules_discipline_over_helpfulness_body_visible = false

[instructions]
# Heading
instructions_section_start_selector = "default"                   # "default" | "procedure" | "steps_with_count"

# Mode explanation
instructions_instruction_mode_explanation_preamble_visible = "auto" # "auto" (render when mixed modes) | "always" | "never"

# Preamble components
instructions_highlight_step_count_preamble_visible = true
instructions_sequence_integrity_preamble_visible = true
instructions_follow_strictly_preamble_visible = true

# Step structure
instructions_steps_index_tracking = "n_of_m"  # "n_only" | "n_of_m"

# Closing
instructions_follow_strictly_closing_visible = true

# Progress
instructions_reminder_midpoint_preamble_visible = false

# Scaffolding tier override (null = auto from step count)
instructions_pre_scaffolding_tier_override = "auto"  # "auto" | "lightweight" | "standard" | "heavy"

[examples]
examples_section_preamble_visible = true

# Group heading suppression for single-group agents
examples_groups_suppress_lone_heading = true

# Override for per-group display_headings from data
examples_groups_display_headings_override = false

# Override for per-group max_number from data
examples_groups_max_number_override = false

# Whether a framing preamble renders between the group heading and first entry
examples_group_framing_preamble_visible = false

[constraints]
# Visibility / activation
constraints_pre_section_visible = true

# Maximum entries to render (0 = render all)
constraints_pre_max_entries_rendered = 0

constraints_section_preamble_visible = true
constraints_constraints_are_not_steps_preamble_visible = true
constraints_no_inferred_constraints_preamble_visible = true
constraints_compliance_reminder_closing_visible = true
constraints_constraint_count_heading_visible = true
constraints_hierarchy_tier_comparison_preamble_visible = true
constraints_hierarchy_three_tier_explanation_preamble_visible = true

# Variant selectors (conditional on their _visible gates above)
constraints_section_preamble_selector = "standalone"       # "standalone" | "references_instructions" | "references_critical_rules"
constraints_no_inferred_constraints_preamble_selector = "light"     # "light" | "explicit"
constraints_compliance_reminder_closing_selector = "evaluation_warning"  # "evaluation_warning" | "simultaneity"

[anti_patterns]
# Whether to render the section at all
anti_patterns_pre_section_visible = true

# Maximum entries to render (0 = render all)
anti_patterns_pre_max_entries_rendered = 0

# Whether to include a preamble line before the pattern list
anti_patterns_section_preamble_visible = true

# Whether to include authority positioning prose
anti_patterns_constraints_vs_anti_patterns_distinction_preamble_visible = true

[success_criteria]
# Master visibility toggle
success_criteria_pre_section_visible = true

# Maximum entries to render (0 = render all)
success_criteria_pre_max_entries_rendered = 0

# Definition framing paradigm
success_criteria_definition_declaration_selector = "declarative_assertion"

# Evidence list framing paradigm
success_criteria_evidence_intro_selector = "properties"

# Hierarchy connector paradigm
success_criteria_definition_to_evidence_transition_selector = "goal_then_criteria"

# Evidence type handling
success_criteria_criteria_evidence_type_handling = "undifferentiated"

# Whether to include explicit statement that success != not-failing
success_criteria_success_failure_independence_statement_postscript_visible = true

# Whether to include verification guidance suffix for mixed evidence lists
success_criteria_verification_guidance_postscript_visible = false

# Multi-criteria relationship paradigm
success_criteria_criteria_relationship = "independent_blocks"

[failure_criteria]
# Master visibility toggle
failure_criteria_pre_section_visible = true

# Maximum entries to render (0 = render all)
failure_criteria_pre_max_entries_rendered = 0

# Whether to render the behavioral preamble
failure_criteria_abort_stance_preamble_visible = true

# Whether to include hierarchy framing
failure_criteria_cite_definition_and_evidence_postscript_visible = false

# Whether to include the generic temporal instruction
failure_criteria_check_before_and_during_postscript_visible = false

# Abort behavioral posture (both selectors use same value — they switch together)
failure_criteria_abort_stance_selector = "obligation"  # "obligation" | "permission"

[input]
input_section_preamble_visible = true
input_context_required_intro_visible = true
input_parameters_transition_visible = true
input_input_completeness_postscript_visible = false
input_schema_label_visible = true
input_parameters_heading_visible = "auto"
input_parameters_heading_auto_threshold = 2

[output]
# Variant selectors
output_schema_embed = false
output_directory_location_selector = "standard"    # "standard" | "with_boundary"

[writing_output]
# Transition sentence connecting from instructions to this section
writing_output_transition_preamble_visible = true

# Tool exclusivity mandate prose
writing_output_tool_mandate_preamble_visible = true

# Heredoc syntax explanation
writing_output_heredoc_explanation_postscript_visible = false

[return_format]
# Two-channel model
return_format_files_vs_status_explanation_preamble_visible = true

# Protocol preamble
return_format_token_must_be_first_word_preamble_visible = true

# Metrics obligation
return_format_report_all_metrics_postscript_visible = true

# ABORT vs FAILURE semantic distinction
return_format_abort_vs_failure_distinction_preamble_visible = true

# Failure honesty
return_format_honest_failure_over_dubious_success_preamble_visible = true

# Retroactive orientation
return_format_track_metrics_as_you_work_postscript_visible = true

# Accuracy clause
return_format_do_not_fabricate_metrics_postscript_visible = true

# Cross-reference to failure_criteria section
return_format_failure_cross_reference_preamble_visible = false

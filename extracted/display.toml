[global_defaults]
# Separator between adjacent sections (default for all sections unless overridden)
global_defaults_inter_section_separator = "horizontal_rule"

# Separator between output points within a section (default for all sections)
global_defaults_intra_section_separator = "double_newline"

[identity]
identity_role_expertise_format = ["bulleted", "inline"]
identity_role_expertise_format_threshold = 3

[security_boundary]
# Path style: "relative_dotslash" | "relative_bare" | "absolute"
security_boundary_filesystem_permissions_path_style = "relative_dotslash"

# Tool display format: "grouped" | "per_entry_list" | "per_entry_prose"
security_boundary_filesystem_permissions_toolset_format = "per_entry_list"

# Entry count threshold for switching from no-intro to intro-present
security_boundary_filesystem_permissions_label_visibility_threshold = 4

# Entry list marker style (applied by display layer)
security_boundary_filesystem_permissions_list_format = "bullet"

[critical_rules]
# Path display format: "backtick" wraps {{workspace_path}} in backticks, "plain" leaves as-is
critical_rules_workspace_path_format = "backtick"

# Tool name display format: "backtick" wraps {{tool_name}} in backticks, "plain" leaves as-is
critical_rules_tool_name_format = "backtick"

# Tool name repetition: "repeat" uses full name at every mention, "shorthand" defines once then uses "the tool"
critical_rules_tool_name_repetition = "repeat"

# Batch size display format: "bold" wraps in **, "metadata" renders as "Batch size = N", "plain" inline
critical_rules_batch_size_format = "plain"

# Rule separator: string inserted between rules. Newline for density, double-newline for visual separation
critical_rules_pre_body_entry_separator_override = "double_newline"

[instructions]
# Step header formatting
instructions_steps_heading_format = "bold"  # "bold" | "h3"

# Step body visual container
instructions_steps_body_container = "none"  # "none" | "blockquote"

# Mode label separator (between mode label and step header)
instructions_steps_mode_separator = "dash"

# Suppress consecutive same-mode labels
instructions_steps_mode_restrict_to_transition = false

# Scaffolding tier thresholds
instructions_steps_scaffolding_lightweight_threshold = 3
instructions_steps_scaffolding_standard_threshold = 7

[examples]
# Entry heading format — bold text vs H4
# Bold preserves boundaries without visual density for groups with 5+ entries
examples_groups_entry_heading_format = "bold"

# Entry body container — how entry content is visually contained
examples_groups_entry_body_container = "bare_with_endmarker"

# Entry separator — what divides entries when headings are off (per-group data)
examples_groups_entry_separator = "horizontal_rule"

# Multi-group separator — visual break between groups (only when group_count > 1)
examples_groups_separator = "horizontal_rule"  # "horizontal_rule" | "none"

[constraints]
# Enumeration format
constraints_rules_format = ["bulleted", "numbered"]
constraints_rules_format_threshold = 6

# Closing reinforcement activation threshold
constraints_compliance_reminder_closing_visibility_threshold = 6

# Constraint count heading activation threshold
constraints_constraint_count_heading_visibility_threshold = 6

# MUST/MUST-NOT rendering treatment
constraints_rules_polarity_normalization = "preserve_voice"  # "preserve_voice" | "normalize_outliers" | "prefix_tags"

# Polarity grouping for long lists
constraints_rules_polarity_grouping_threshold = 11

[anti_patterns]
# Format for rendering the pattern list
# Options: "bare_bullets", "bold_prohibition"
anti_patterns_patterns_format = "bare_bullets"

[success_criteria]
# Evidence item format: threshold-based on evidence count
success_criteria_criteria_evidence_format_threshold = 5
success_criteria_criteria_evidence_format = ["bulleted", "numbered"]

[failure_criteria]
# Evidence item format
failure_criteria_criteria_evidence_format = "bare"

[input]
input_context_required_format = "numbered"
input_context_available_format = "bulleted"
input_parameters_format = ["bulleted", "prose"]
input_parameters_format_threshold = 2

[output]

[writing_output]

[return_format]

